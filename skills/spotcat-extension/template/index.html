<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Text Stats</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <textarea id="input" data-i18n-placeholder="inputPlaceholder" spellcheck="false" autofocus></textarea>
  <div class="stats" id="stats"></div>
  <div class="actions">
    <span class="status" id="status"></span>
    <button id="copy" data-i18n="copy"></button>
  </div>

<!-- Use a plain <script src>: pages are opened from file://, where type="module" may be blocked -->
<script src="main.js"></script>
</body>
</html>
