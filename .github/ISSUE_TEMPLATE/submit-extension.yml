name: Submit an extension
description: Get your open-source extension listed in the Spotcat store
title: "[Submit] "
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing! Please read the [Publishing section of the developer docs](https://github.com/thinkany-ai/spotcat-extensions/blob/main/docs/development.md#publishing) first.
  - type: input
    id: repo
    attributes:
      label: Repository
      description: A public GitHub repository, ideally named spotcat-extension-<name>
      placeholder: https://github.com/you/spotcat-extension-hello
    validations:
      required: true
  - type: input
    id: ref
    attributes:
      label: Release tag
      description: The tag (or commit) to list; it must match version in manifest.json
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: id
    attributes:
      label: Extension id
      description: The id in manifest.json
      placeholder: hello
    validations:
      required: true
  - type: input
    id: path
    attributes:
      label: Subdirectory
      description: Optional — only if manifest.json isn't at the repository root
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What it does and how it's triggered (keywords / content match). Screenshots help.
    validations:
      required: true
  - type: textarea
    id: permissions
    attributes:
      label: Permissions
      description: With network, list the domains called and why; with ai, describe what is sent to the model
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: Passes `python3 scripts/pack.py --check`
          required: true
        - label: No obfuscated code and no remotely loaded scripts
          required: true
        - label: The repository has a README and an open-source license
          required: true
        - label: Tested in Spotcat in light and dark appearance
          required: true
