<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Notes</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <aside>
    <div class="search-row">
      <input id="search" type="search" data-i18n-placeholder="search" spellcheck="false">
      <button id="new" class="icon-btn" data-i18n-title="new">＋</button>
    </div>
    <ul id="list"></ul>
    <div class="list-foot" id="count"></div>
  </aside>
  <main>
    <div class="toolbar">
      <span class="meta" id="meta"></span>
      <span class="buttons">
        <button id="pin"></button>
        <button id="copy" data-i18n="copy"></button>
        <button id="ask-ai" data-i18n="askAI"></button>
        <button id="delete" class="danger" data-i18n="delete"></button>
      </span>
    </div>
    <textarea id="editor" data-i18n-placeholder="editorPlaceholder" spellcheck="false"></textarea>
    <div class="empty" id="empty"></div>
    <div class="hint" data-i18n="hint"></div>
  </main>
  <div class="toast" id="toast"><span id="toast-text"></span><button id="toast-action"></button></div>

<script src="main.js"></script>
</body>
</html>
